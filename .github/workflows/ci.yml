name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gdb strace

      - name: Show environment
        run: |
          uname -a
          gcc --version
          make --version
          gdb --version
          strace --version
          cat /proc/version

      - name: Build
        run: |
          make clean
          make

      - name: Run hello
        run: ./build/hello

      - name: Run tests
        run: make test